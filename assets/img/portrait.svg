<!-- PLACEHOLDER — remplacer par une photo (ratio 4:5, ~900x1125 px, JPG ou WebP).
     Le traitement duotone vert est appliqué en CSS : une photo couleur ordinaire
     s'intègre directement, et retrouve ses couleurs au survol. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 675" role="img" aria-label="Emplacement du portrait">
  <defs>
    <linearGradient id="nuit" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0%" stop-color="#0B2A23"/>
      <stop offset="100%" stop-color="#041512"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".28" r=".55">
      <stop offset="0%" stop-color="#3BE07D" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#3BE07D" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="540" height="675" fill="url(#nuit)"/>
  <rect width="540" height="675" fill="url(#halo)"/>

  <!-- Silhouette adossée au comptoir -->
  <g fill="#3BE07D" opacity=".13">
    <circle cx="270" cy="252" r="92"/>
    <path d="M104 675c0-94 74-170 166-170s166 76 166 170H104Z"/>
  </g>

  <!-- Trame de diodes, écho à l'enseigne -->
  <g fill="#3BE07D" opacity=".16">
    <circle cx="452" cy="86" r="4"/><circle cx="470" cy="86" r="4"/><circle cx="488" cy="86" r="4"/>
    <circle cx="470" cy="68" r="4"/><circle cx="470" cy="104" r="4"/>
  </g>

  <text x="270" y="620" text-anchor="middle" font-family="ui-monospace, monospace"
        font-size="15" letter-spacing="3" fill="#6F8880">PORTRAIT À REMPLACER</text>
</svg>
